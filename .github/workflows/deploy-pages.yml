# main に入った内容を GitHub Pages に公開する
# 事前準備（1回だけ）：リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
# ※ 非公開リポジトリで Pages を使うには有料プラン（GitHub Pro など）が必要
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - id: pages
        uses: actions/configure-pages@v5
      # OGP（共有カード画像）用に公開 URL を渡す
      # 独自ドメインで HTTPS の強制が反映される前は base_url が http:// になるため、https:// に揃える
      - run: SITE_URL="https://${BASE_URL#*://}/" bun run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
