# 型チェック・テスト・ビルドを、プッシュとプルリクエストのたびに実行する
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

# 読み取りだけで足りるので、自動で渡されるトークンの権限を最小にする
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      # 全国完飲番付 API（worker/）の型チェック
      - run: bun install --frozen-lockfile
        working-directory: worker
      - run: bunx tsc --noEmit -p .
        working-directory: worker
